server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Repassa /api/* pro container da API (serviço "api" da mesma rede do
  # Docker Compose, porta interna 8000) removendo o prefixo /api antes de
  # encaminhar — o backend continua respondendo em suas rotas normais
  # (/auth/login, /projects, etc.), só o navegador é que enxerga tudo sob
  # /api. Com isso, frontend e API ficam na MESMA origem (mesmo
  # host:porta do navegador), então: (1) só a porta do frontend precisa
  # ficar acessível de fora — nunca mais uma segunda porta pra liberar em
  # firewall/roteador pra API; (2) chamadas de navegador deixam de ser
  # cross-origin, então CORS_ORIGINS deixa de ser necessário pro uso normal
  # (só importa se algo externo chamar a API diretamente, fora do
  # navegador). Ver frontend/src/api/client.js (resolveApiBaseUrl).
  location /api/ {
    # Anexos de tickets (até 10 MB cada, 5 por envio) e importação de
    # planilhas: o padrão do nginx (1 MB) recusaria esses uploads.
    client_max_body_size 60m;
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: qualquer rota que não seja um arquivo real cai no index.html (o
  # react-router-dom cuida do roteamento no navegador).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O index.html nunca deve ficar em cache — é ele que referencia os
  # arquivos com hash em /assets/, e precisa ser buscado de novo a cada
  # deploy para o navegador pegar os arquivos novos.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Os arquivos em /assets/ têm hash no nome (gerado pelo Vite) — um deploy
  # novo gera nomes novos, então cache longo aqui é seguro.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
}
