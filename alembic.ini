[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# A URL de conexão real vem de app.database.build_database_url() (mesma
# lógica usada pela API), configurada em alembic/env.py. O valor abaixo é
# apenas um placeholder para ferramentas que leem sqlalchemy.url diretamente
# do arquivo; ele nunca é usado para conectar de fato.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
